name: Deploy CiT Hub

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://hub.citedu.vn
          NEXT_PUBLIC_APP_URL: https://hub.citedu.vn

      - name: Assemble standalone output
        run: |
          # Next.js "output: standalone" chỉ copy sẵn node_modules đã rút gọn vào
          # .next/standalone — nhưng KHÔNG tự copy static assets và public/.
          # Phải copy thủ công theo đúng tài liệu chính thức của Next.js.
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # Đảm bảo Prisma Client (đã generate ở bước trên) có mặt trong bản standalone,
          # vì Next.js file-tracing đôi khi bỏ sót engine binary của Prisma.
          mkdir -p .next/standalone/node_modules/.prisma
          cp -r node_modules/.prisma/client .next/standalone/node_modules/.prisma/client
          mkdir -p .next/standalone/node_modules/@prisma
          cp -r node_modules/@prisma/client .next/standalone/node_modules/@prisma/client

      - name: Package build output
        run: tar -czf next-build.tar.gz -C .next/standalone .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: next-build.tar.gz
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest   # Chạy trên GitHub server, không cần self-hosted runner
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build

      - name: Copy build to VPS
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -P 65002 \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            next-build.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/u969193399/cithub/
          rm -f /tmp/deploy_key

      - name: Extract & restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 65002
          script: |
            set -e
            cd /home/u969193399/cithub
            tar -xzf next-build.tar.gz
            rm next-build.tar.gz
            # Toàn bộ app (server.js, package.json, node_modules, .next, public)
            # đều nằm trong bản standalone — thay hết, chỉ giữ lại thư mục tmp/
            # (Passenger dùng tmp/restart.txt để reload, không được xoá).
            APP_DIR=/home/u969193399/domains/hub.citedu.vn/nodejs
            find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name tmp -exec rm -rf {} +
            find . -mindepth 1 -maxdepth 1 -exec cp -r {} "$APP_DIR"/ \;
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            mkdir -p "$APP_DIR/tmp"
            touch "$APP_DIR/tmp/restart.txt"
