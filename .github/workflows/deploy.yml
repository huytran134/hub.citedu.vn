name: Deploy CiT Hub

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/cithub

            # 1. Pull code mới nhất
            git pull origin main

            # 2. Cài đủ dependencies kể cả devDependencies (Prisma cần prisma CLI)
            npm ci

            # 3. Generate Prisma Client từ schema mới nhất
            npx prisma generate

            # 4. Chạy migration an toàn (chỉ áp dụng migration chưa chạy)
            npx prisma migrate deploy

            # 5. Build Next.js
            npm run build

            # 6. Reload zero-downtime — KHÔNG dùng pm2 restart
            pm2 reload cithub --update-env
